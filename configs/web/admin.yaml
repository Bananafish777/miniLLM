# Web 管理控制台 — 引擎状态 / GPU 指标 / Benchmark 结果 / 微调运行
# 用法: minillm web --config configs/web/admin.yaml
#   打开 http://127.0.0.1:8080
#
# ⚠️ 端口必须与你实际启动的服务一致（各 serve 配置的 port 字段）：
#   hf      ->  configs/serve/hf_tiny.yaml          (port: 8000)
#   sglang  ->  configs/serve/sglang_mac.yaml       (port: 30000, Apple Silicon)
#   vllm    ->  configs/serve/vllm_mac.yaml         (port: 8010, Apple Silicon / vllm-metal)
serve_name: minillm-admin
host: 127.0.0.1
port: 8080

# 要监控的推理引擎（/metrics + /v1/models；对话界面按此列表选择引擎）
engines:
  - name: vllm-mlx              # vLLM on Apple Silicon（vllm-metal 插件）
    type: vllm
    base_url: http://127.0.0.1:8010
  - name: hf-local              # 本地 Transformers 服务（Mac 演示主场景）
    type: hf
    base_url: http://127.0.0.1:8000
  - name: sglang-mlx            # SGLang（Apple Silicon MLX）
    type: sglang
    base_url: http://127.0.0.1:30000

bench_dir: runs/bench        # Benchmark 报告目录
train_dir: runs              # 微调运行目录
refresh_interval_s: 5        # 前端自动刷新间隔

# 可选：Prometheus 代理（GPU 面板；compose 栈运行时可指向 http://127.0.0.1:9090）
# prometheus_url: http://127.0.0.1:9090

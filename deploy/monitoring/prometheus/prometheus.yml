# Prometheus 采集配置 — miniLLM 全栈指标
# 目标:
#   vllm:8000/metrics    vLLM 服务指标（吞吐/排队/cache 命中/TTFT 直方图）
#   sglang:30000/metrics SGLang 服务指标
#   serve-hf:8000/metrics 平台 HF 服务指标（minillm_* 系列）
#   dcgm-exporter:9400/metrics  GPU 硬件指标（利用率/显存/温度）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/minillm-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: sglang
    metrics_path: /metrics
    static_configs:
      - targets: ["sglang:30000"]

  - job_name: minillm-hf
    metrics_path: /metrics
    static_configs:
      - targets: ["serve-hf:8000"]

  - job_name: nvidia-dcgm
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]

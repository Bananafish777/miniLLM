# OpenAI 兼容推理服务（Transformers 后端）— 加载微调产物 runs/<run>/export
# 用法: minillm serve --config configs/serve/hf_qwen25_1p5b.yaml
engine: hf
serve_name: minillm-hf
host: 0.0.0.0
port: 8000

model:
  name_or_path: runs/qwen25-1.5b-lora/export    # 微调合并后的模型（M1 产物）
  dtype: auto                                   # cuda->bf16, cpu/mps->fp32
  attn_impl: sdpa
  max_model_len: 2048

default_temperature: 0.7
default_max_tokens: 512

# QLoRA 微调 Qwen2.5-3B（4-bit NF4，显存峰值 < 16GB）
experiment_name: qwen25-3b-qlora
finetune_mode: qlora

data:
  format: sharegpt
  path: data/raw/conversations.jsonl
  val_size: 0.05
  max_seq_len: 2048

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  source: hub
  dtype: auto
  attn_impl: sdpa
  load_in_4bit: true            # QLoRA: NF4 + double quant（需 bitsandbytes，GPU only）

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null

train:
  output_dir: runs/qwen25-3b-qlora
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-4
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_steps: 200
  save_total_limit: 2
  gradient_checkpointing: true

eval:
  num_samples: 5
  max_new_tokens: 128
  do_sample: true
  temperature: 0.7
  top_p: 0.9

export:
  merge_adapter: true
  quantize: none
  register_mlflow: false

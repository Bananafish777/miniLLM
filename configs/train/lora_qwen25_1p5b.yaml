# LoRA 微调 Qwen2.5-1.5B（单卡 24GB 推荐配置）
experiment_name: qwen25-1.5b-lora
finetune_mode: lora

data:
  format: alpaca                # 换成自己的数据: path: data/raw/your_alpaca.jsonl
  path: null
  val_size: 0.05
  max_seq_len: 2048

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  source: hub
  dtype: auto                   # cuda->bf16, cpu/mps->fp32
  attn_impl: sdpa

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null          # null = 自动探测 (q/k/v/o/gate/up/down_proj)

train:
  output_dir: runs/qwen25-1.5b-lora
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_steps: 200
  save_total_limit: 2
  gradient_checkpointing: true

eval:
  num_samples: 5
  max_new_tokens: 128
  do_sample: true
  temperature: 0.7
  top_p: 0.9

export:
  merge_adapter: true           # 合并 LoRA -> 可直接被 vLLM 加载
  quantize: none
  register_mlflow: false

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "minillm.labels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.monitoring.serviceMonitor.enabled }}
# ServiceMonitor（需 prometheus-operator/kube-prometheus-stack 提供 CRD）
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "minillm.fullname" . }}
  labels:
    {{- include "minillm.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app: minillm-vllm
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}

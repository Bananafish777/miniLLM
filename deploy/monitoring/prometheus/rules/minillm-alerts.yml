# miniLLM 告警规则（M4 基础版，M6 完善）
groups:
  - name: minillm-services
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "服务不可达 {{ $labels.job }}"
          description: "Prometheus 已连续 2 分钟无法抓取 {{ $labels.job }} 的 /metrics"

  - name: minillm-gpu
    rules:
      - alert: GpuMemoryHigh
        expr: |
          (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU 显存水位过高 ({{ $value | humanizePercentage }})"
          description: "GPU {{ $labels.uuid }} 显存占用超过 90% — 检查 KV Cache 预算 (gpu_memory_utilization) 与并发"

      - alert: GpuUtilizationNearZero
        expr: avg(DCGM_FI_DEV_GPU_UTIL) < 5 and up{job="vllm"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU 利用率极低"
          description: "vLLM 在线但 GPU 利用率 <5% 持续 15 分钟 — 疑似无流量或配置异常"

  - name: minillm-serving
    rules:
      - alert: VllmQueueBacklog
        expr: vllm:num_requests_waiting > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "vLLM 排队请求过多 ({{ $value }})"
          description: "排队超过 50 — 考虑扩容副本 (HPA) 或提升 max_num_seqs"

      - alert: TtftDegraded
        expr: |
          histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))
          > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TTFT-p99 超过 5s"
          description: "首 token 延迟劣化 — 检查 prefill 压力与排队"

      - alert: HighAbortRate
        expr: |
          sum(rate(vllm:num_requests_finished_total{finished_reason="abort"}[5m]))
          /
          sum(rate(vllm:num_requests_finished_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "vLLM abort 率超过 10%"
          description: "请求被中断比例过高 — 检查客户端超时/服务重启/显存 OOM（abort 常由 KV Cache 不足触发）"

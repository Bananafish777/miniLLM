# 全参微调 Qwen2.5-1.5B（显存要求高，建议多卡或大显存；单卡 24GB 可尝试 batch=1+grad_accum）
experiment_name: qwen25-1.5b-full
finetune_mode: full

data:
  format: alpaca
  path: data/raw/your_alpaca.jsonl
  val_size: 0.05
  max_seq_len: 2048

model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  source: hub
  dtype: auto
  attn_impl: sdpa
  load_in_4bit: false

train:
  output_dir: runs/qwen25-1.5b-full
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_steps: 200
  save_total_limit: 2
  gradient_checkpointing: true

eval:
  num_samples: 5
  max_new_tokens: 128
  do_sample: true
  temperature: 0.7
  top_p: 0.9

export:
  merge_adapter: true
  quantize: none
  register_mlflow: false
